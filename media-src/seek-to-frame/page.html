<!doctype html>
<html data-aspect="16:9">
<head>
<meta charset="utf-8">
<meta name="duration" content="5">
<meta name="aspect" content="16:9">
<meta name="message" content="the same t always gives the same frame">
<meta name="spectacle" content="3.8">
<title>seek to frame</title>
<style>
  @font-face { font-family: "Geist"; src: url("assets/Geist.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Plex"; src: url("assets/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Plex"; src: url("assets/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; }
  :root {
    --bg: #000; --surface: #0a0a0a; --well: #111; --line: #242424; --line-2: #3a3a3a;
    --ink: #fff; --ink-2: #ededed; --muted: #a1a1a1; --accent: #3291ff;
    --u: calc(var(--vh) / 1080);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); font-family: "Geist", sans-serif; }
  .world { position: absolute; inset: 0; }
  .ground { position: absolute; inset: 0; background-image: radial-gradient(circle, #1c1c1c calc(var(--u) * 1.6), transparent calc(var(--u) * 2)); background-size: calc(var(--u) * 48) calc(var(--u) * 48); }
  .panel { position: absolute; top: calc(var(--vh) * 0.1); height: calc(var(--vh) * 0.8); background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--u) * 24); box-sizing: border-box; padding: calc(var(--u) * 44); }
  .left { left: calc(var(--vw) * 0.06); width: calc(var(--vw) * 0.42); }
  .right { right: calc(var(--vw) * 0.06); width: calc(var(--vw) * 0.42); }
  .tag { font-family: "Plex", monospace; font-size: calc(var(--u) * 32); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  pre { margin: calc(var(--u) * 28) 0 0; font-family: "Plex", monospace; font-size: calc(var(--u) * 40); line-height: 1.5; color: var(--ink-2); }
  pre .c { color: var(--muted); }
  pre .a { color: var(--accent); }
  .track { position: absolute; left: calc(var(--u) * 44); right: calc(var(--u) * 44); bottom: calc(var(--u) * 104); height: 0; border-top: calc(var(--u) * 2) solid var(--line-2); }
  .log { margin-top: calc(var(--u) * 28); font-family: "Plex", monospace; font-size: calc(var(--u) * 38); line-height: 1.5; color: var(--muted); }
  .log .hit { color: var(--accent); }
  .tick { position: absolute; white-space: nowrap; top: calc(var(--u) * 14); transform: translateX(-50%); font-family: "Plex", monospace; font-size: calc(var(--u) * 32); color: var(--muted); }
  .tick::before { content: ""; position: absolute; left: 50%; top: calc(var(--u) * -22); height: calc(var(--u) * 12); border-left: calc(var(--u) * 2) solid var(--line-2); }
  .head { position: absolute; top: 0; width: 0; }
  .head i { position: absolute; left: calc(var(--u) * -2); top: calc(var(--u) * -40); width: calc(var(--u) * 4); height: calc(var(--u) * 40); background: var(--accent); border-radius: calc(var(--u) * 2); }
  .head b { position: absolute; left: 50%; bottom: calc(var(--u) * 48); transform: translateX(-50%); white-space: nowrap; font-family: "Plex", monospace; font-weight: 500; font-size: calc(var(--u) * 40); color: var(--accent); }
  .screen { position: relative; margin-top: calc(var(--u) * 28); aspect-ratio: 16 / 9; background: var(--well); border: 1px solid var(--line); border-radius: calc(var(--u) * 12); overflow: hidden; }
  .screen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen .t { position: absolute; left: calc(var(--u) * 24); top: calc(var(--u) * 20); font-family: "Plex", monospace; font-size: calc(var(--u) * 34); color: var(--muted); }
  .readout { margin-top: calc(var(--u) * 24); font-family: "Plex", monospace; font-size: calc(var(--u) * 42); color: var(--ink-2); }
  .readout .n { color: var(--ink); }
  .same { position: absolute; left: calc(var(--u) * 44); bottom: calc(var(--u) * 40); display: flex; align-items: center; gap: calc(var(--u) * 14); padding: calc(var(--u) * 12) calc(var(--u) * 22); border: 1px solid var(--accent); border-radius: 999px; font-family: "Plex", monospace; font-weight: 500; font-size: calc(var(--u) * 38); color: var(--accent); }
</style>
</head>
<body>
<div class="world" data-world="seek">
  <div class="ground"></div>
  <div class="panel left">
    <div class="tag">page.html</div>
<pre><span class="c">&lt;div class="ball"&gt;&lt;/div&gt;</span>
window.<span class="a">seek</span> = (t) =&gt; {
  ball.place(path(t));
};</pre>
    <div class="log"><div>seek(1.2) → frame <span>72</span></div><div>seek(3.0) → frame <span>180</span></div><div>seek(1.2) → frame <span class="hit">72</span></div></div>
    <div class="track">
      <span class="tick" style="left:0%">0</span><span class="tick" style="left:20%">1</span><span class="tick" style="left:40%">2</span>
      <span class="tick" style="left:60%">3</span><span class="tick" style="left:80%">4</span><span class="tick" style="left:100%">5</span>
      <div class="head"><i></i><b>seek(0.0)</b></div>
    </div>
  </div>
  <div class="panel right">
    <div class="tag">frame</div>
    <div class="screen">
      <svg viewBox="0 0 160 90" preserveAspectRatio="none"><polyline class="path" fill="none" stroke="#3a3a3a" stroke-width="0.4"></polyline></svg>
      <svg viewBox="0 0 160 90"><circle class="ball" r="5" fill="#fff"></circle></svg>
      <div class="t">t = 0.0 s</div>
    </div>
    <div class="readout">frame <span class="n">0</span></div>
    <div class="same">same t, same frame</div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const FILM_LENGTH = 5;
const FPS = 60;
// [second, playhead t]: the playhead rests on 0, seeks to 1.2, to 3.0, then back to 1.2
const PLAYHEAD = [[0.6, 0], [1.4, 1.2], [1.9, 1.2], [2.6, 3.0], [3.1, 3.0], [3.8, 1.2]];
const PANEL_IN = [[0.0, 0], [0.5, 1]];
const SAME_IN = [[3.95, 0], [4.35, 1]];
const FLASH = 0.18;

const easeOut = (x) => 1 - Math.pow(1 - x, 5);
const easeOutBack = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
function sample(table, t) {
  if (t <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    const [t1, v1] = table[i];
    const [t0, v0] = table[i - 1];
    if (t <= t1) return v0 + (v1 - v0) * easeOut((t - t0) / (t1 - t0));
  }
  return table[table.length - 1][1];
}
// the frame shows the playhead's last resting value, from the second the playhead lands
function shownTime(t) {
  let shown = PLAYHEAD[0][1];
  let landed = 0;
  for (let i = 1; i < PLAYHEAD.length; i++) {
    if (t >= PLAYHEAD[i][0] && PLAYHEAD[i][1] !== PLAYHEAD[i - 1][1]) { shown = PLAYHEAD[i][1]; landed = PLAYHEAD[i][0]; }
  }
  return { shown, landed };
}
const ballAt = (ft) => {
  const u = ft / FILM_LENGTH;
  return [16 + 128 * u, 70 - 46 * Math.sin(Math.PI * u)];
};
$('.path').setAttribute('points', Array.from({ length: 41 }, (_, i) => ballAt((i / 40) * FILM_LENGTH).join(',')).join(' '));

window.seek = (t) => {
  const p = sample(PLAYHEAD, t);
  const head = $('.head');
  head.style.left = (p / FILM_LENGTH) * 100 + '%';
  head.querySelector('b').textContent = 'seek(' + p.toFixed(1) + ')';

  const { shown, landed } = shownTime(t);
  const [x, y] = ballAt(shown);
  $('.ball').setAttribute('cx', x);
  $('.ball').setAttribute('cy', y);
  $('.t').textContent = 't = ' + shown.toFixed(1) + ' s';
  $('.readout .n').textContent = String(Math.round(shown * FPS));
  $('.screen').style.opacity = landed && t - landed < FLASH ? 0.35 + 0.65 * ((t - landed) / FLASH) : 1;

  const panels = sample(PANEL_IN, t);
  for (const el of document.querySelectorAll('.panel')) {
    el.style.opacity = panels;
    el.style.transform = 'translateY(' + (1 - panels) * 24 + 'px)';
  }
  const landings = PLAYHEAD.filter((row, i) => i > 0 && row[1] !== PLAYHEAD[i - 1][1]);
  document.querySelectorAll('.log > div').forEach((row, i) => {
    const shown = Math.min(1, Math.max(0, (t - landings[i][0]) / FLASH));
    row.style.opacity = shown;
    row.style.transform = 'translateX(' + (1 - shown) * 12 + 'px)';
  });
  const sameRaw = Math.min(1, Math.max(0, (t - SAME_IN[0][0]) / (SAME_IN[1][0] - SAME_IN[0][0])));
  const same = easeOutBack(sameRaw);
  $('.same').style.opacity = Math.min(1, sameRaw * 2);
  $('.same').style.transform = 'translateY(' + (1 - same) * 24 + 'px) scale(' + (0.92 + 0.08 * same) + ')';
  $('.readout .n').style.color = sameRaw > 0 ? 'var(--accent)' : '';
  $('.ground').style.backgroundPosition = t * 6 + 'px ' + t * 3 + 'px';
};
window.seek(0);
</script>
</body>
</html>
